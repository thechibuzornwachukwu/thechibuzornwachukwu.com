<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write · Chibuzor Nwachukwu</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a; color: #e0e0e0; min-height: 100vh;
    }

    /* Password Gate */
    .gate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
    }
    .gate.hidden { display: none; }
    .gate-box {
      background: #2a2a2a; padding: 48px; border-radius: 12px;
      text-align: center; max-width: 400px; width: 90%;
    }
    .gate-box h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
    .gate-box p { color: #999; margin-bottom: 24px; font-size: 14px; }
    .gate-box input {
      width: 100%; padding: 12px 16px; border: 1px solid #444; border-radius: 8px;
      background: #1a1a1a; color: #fff; font-size: 16px; outline: none;
    }
    .gate-box input:focus { border-color: #A85751; }
    .gate-box .error { color: #c62828; font-size: 13px; margin-top: 12px; display: none; }
    .gate-box .error.show { display: block; }
    .gate-box button {
      margin-top: 16px; padding: 12px 32px; border: none; border-radius: 8px;
      background: #A85751; color: #fff; font-size: 16px; cursor: pointer;
    }
    .gate-box button:hover { background: #8C3A36; }

    /* Layout */
    .app { display: none; height: 100vh; }
    .app.active { display: flex; }
    .pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .pane-header {
      padding: 16px 24px; background: #222; border-bottom: 1px solid #333;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .pane-header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; }
    .pane-header .badge { font-size: 11px; background: #333; padding: 2px 8px; border-radius: 4px; color: #aaa; }
    .pane-body { flex: 1; overflow-y: auto; padding: 24px; }

    /* Form */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 4px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 10px 12px; border: 1px solid #444; border-radius: 6px;
      background: #1a1a1a; color: #e0e0e0; font-size: 14px; outline: none;
    }
    .field input:focus, .field textarea:focus { border-color: #A85751; }
    .field textarea { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; line-height: 1.6; resize: vertical; }
    .field-row { display: flex; gap: 16px; }
    .field-row .field { flex: 1; }
    .slug-hint { font-size: 12px; color: #666; margin-top: 2px; }
    .char-count { font-size: 11px; color: #666; text-align: right; margin-top: 2px; }

    /* Editor */
    #markdown-editor {
      min-height: 400px; flex: 1; tab-size: 2;
    }

    /* Toolbar */
    .toolbar {
      display: flex; gap: 6px; padding: 10px 24px; background: #222;
      border-bottom: 1px solid #333; flex-wrap: wrap; flex-shrink: 0;
    }
    .toolbar button {
      padding: 6px 12px; border: 1px solid #444; border-radius: 4px;
      background: #2a2a2a; color: #ccc; font-size: 13px; cursor: pointer;
    }
    .toolbar button:hover { background: #333; border-color: #A85751; }
    .toolbar .spacer { flex: 1; }
    .toolbar .img-upload { position: relative; overflow: hidden; }
    .toolbar .img-upload input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    /* Preview */
    .preview {
      line-height: 1.8; color: #e0e0e0; max-width: 720px;
    }
    .preview h1 { font-size: 32px; color: #fff; margin-bottom: 8px; }
    .preview h2 { font-size: 24px; color: #fff; margin: 32px 0 12px; }
    .preview h3 { font-size: 20px; color: #ccc; margin: 24px 0 8px; }
    .preview p { margin-bottom: 16px; }
    .preview img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
    .preview blockquote {
      border-left: 3px solid #A85751; padding-left: 16px; margin: 16px 0;
      color: #999; font-style: italic;
    }
    .preview code { background: #2a2a2a; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
    .preview pre code { display: block; padding: 16px; overflow-x: auto; }
    .preview ul, .preview ol { margin: 12px 0; padding-left: 24px; }
    .preview li { margin-bottom: 4px; }
    .preview em { color: #ccc; }
    .preview strong { color: #fff; }
    .preview hr { border: none; border-top: 1px solid #333; margin: 32px 0; }

    /* Actions */
    .actions {
      padding: 16px 24px; background: #222; border-top: 1px solid #333;
      display: flex; gap: 12px; align-items: center; flex-shrink: 0;
    }
    .actions button {
      padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .btn-primary { background: #A85751; color: #fff; }
    .btn-primary:hover { background: #8C3A36; }
    .btn-secondary { background: #333; color: #ccc; border: 1px solid #444; }
    .btn-secondary:hover { background: #3a3a3a; }
    .actions .status { font-size: 12px; color: #666; }
    .actions .status.saved { color: #4caf50; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
      border-radius: 8px; background: #333; color: #fff; font-size: 13px;
      z-index: 100; opacity: 0; transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #1b5e20; }
    .toast.error { background: #b71c1c; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #444; border-radius: 8px; padding: 24px;
      text-align: center; color: #666; font-size: 13px; transition: all 0.2s;
    }
    .drop-zone.dragover { border-color: #A85751; background: rgba(168,87,81,0.1); color: #A85751; }

    @media (max-width: 900px) {
      .app.active { flex-direction: column; }
      .pane { max-height: 50vh; }
    }
  </style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Write</h1>
    <p>Enter the passkey to continue</p>
    <input type="password" id="pass-input" placeholder="Passkey" autofocus>
    <div class="error" id="pass-error">Incorrect passkey</div>
    <button id="pass-btn">Unlock</button>
  </div>
</div>

<div class="app" id="app">
  <!-- Editor Pane -->
  <div class="pane">
    <div class="pane-header">
      <h2>Editor</h2>
      <span class="badge">Markdown</span>
    </div>
    <div class="pane-body" style="padding-bottom:8px">
      <div class="field">
        <label>Title</label>
        <input type="text" id="title" placeholder="Article title" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Slug</label>
          <input type="text" id="slug" placeholder="my-article-slug" autocomplete="off">
          <div class="slug-hint">URL: thechibuzornwachukwu.com/insights/<span id="slug-preview">my-article-slug</span></div>
        </div>
        <div class="field" style="flex:0.6">
          <label>Date</label>
          <input type="text" id="date" placeholder="2026" autocomplete="off">
        </div>
        <div class="field" style="flex:0.4">
          <label>Read time</label>
          <input type="text" id="read-time" placeholder="5 min read" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label>Meta Description</label>
        <input type="text" id="description" placeholder="A short summary for search results and social shares" autocomplete="off">
        <div class="char-count"><span id="desc-count">0</span>/160</div>
      </div>
      <div class="field">
        <label>Hero Image filename</label>
        <input type="text" id="hero-img" placeholder="my-article-slug.webp" autocomplete="off">
        <div class="slug-hint">Place the image at /insights/<span id="hero-path-preview">slug</span>/ and reference it here</div>
      </div>
    </div>
    <div class="toolbar">
      <button onclick="insertMd('**','**')"><strong>B</strong></button>
      <button onclick="insertMd('*','*')"><em>I</em></button>
      <button onclick="insertMd('### ','')">H3</button>
      <button onclick="insertMd('> ','')">Quote</button>
      <button onclick="insertMd('```\n','\n```')">Code</button>
      <button onclick="insertMd('- ','')">List</button>
      <button onclick="insertMd('[','](url)')">Link</button>
      <label class="img-upload">
        <button>Image</button>
        <input type="file" accept="image/*" id="img-upload" onchange="handleImageUpload(event)">
      </label>
      <span class="spacer"></span>
      <button onclick="autoSlug()" title="Regenerate slug from title">↻ Slug</button>
      <button onclick="autoReadTime()" title="Calculate read time from content">⏱ Time</button>
    </div>
    <div class="pane-body" style="padding-top:0; flex:1; display:flex; flex-direction:column;">
      <div class="drop-zone" id="drop-zone">Drop images here or use the Image button above</div>
      <textarea id="markdown-editor" placeholder="Write your article in markdown..."></textarea>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="exportArticle()">⬇ Export Article</button>
      <button class="btn-secondary" onclick="exportCard()">⬇ Export Listing Card</button>
      <button class="btn-secondary" onclick="saveDraft()">💾 Save Draft</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <!-- Preview Pane -->
  <div class="pane" style="border-left:1px solid #333">
    <div class="pane-header">
      <h2>Preview</h2>
      <span class="badge">Live</span>
    </div>
    <div class="pane-body preview" id="preview">
      <p style="color:#666;font-style:italic;">Start writing to see a live preview…</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Password ──────────────────────────────────────────────
  const PASS = 'write2026';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');

  if (sessionStorage.getItem('unlocked') === '1') {
    gate.classList.add('hidden');
    app.classList.add('active');
  }

  document.getElementById('pass-btn').onclick = unlock;
  document.getElementById('pass-input').onkeydown = e => { if (e.key === 'Enter') unlock(); };

  function unlock() {
    if (document.getElementById('pass-input').value === PASS) {
      sessionStorage.setItem('unlocked', '1');
      gate.classList.add('hidden');
      app.classList.add('active');
      loadDraft();
      updatePreview();
    } else {
      document.getElementById('pass-error').classList.add('show');
    }
  }

  // ── Auto-slug from title ──────────────────────────────────
  function autoSlug() {
    const t = document.getElementById('title').value;
    if (!t) { toast('Enter a title first', 'error'); return; }
    document.getElementById('slug').value = t.toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    slugChanged();
    toast('Slug generated', '');
  }
  function slugChanged() {
    const s = document.getElementById('slug').value || 'my-article-slug';
    document.getElementById('slug-preview').textContent = s;
    const h = document.getElementById('hero-img');
    if (!h.value) h.value = s + '.webp';
    document.getElementById('hero-path-preview').textContent = s;
  }
  document.getElementById('title').oninput = () => {
    if (!document.querySelector('#slug:focus')) autoSlug();
    descCount();
  };
  document.getElementById('slug').oninput = slugChanged;
  slugChanged();

  // ── Desc char count ────────────────────────────────────────
  function descCount() {
    const len = document.getElementById('description').value.length;
    document.getElementById('desc-count').textContent = len;
  }
  document.getElementById('description').oninput = descCount;

  // ── Auto read time ─────────────────────────────────────────
  function autoReadTime() {
    const text = document.getElementById('markdown-editor').value;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const min = Math.max(1, Math.round(words / 200));
    document.getElementById('read-time').value = min + ' min read';
    toast('Read time: ' + min + ' min', '');
  }

  // ── Toolbar helpers ────────────────────────────────────────
  function insertMd(before, after) {
    const ta = document.getElementById('markdown-editor');
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.substring(start, end);
    ta.value = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + before.length + sel.length + after.length;
    ta.dispatchEvent(new Event('input'));
  }

  // ── Image upload ────────────────────────────────────────────
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    processImage(file);
    e.target.value = '';
  }

  // Drag-drop support
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length) processImage(files[0]);
  });

  function processImage(file) {
    if (!file.type.startsWith('image/')) { toast('Not an image', 'error'); return; }
    if (file.size > 500 * 1024) {
      if (!confirm('Image is ' + (file.size / 1024).toFixed(0) + 'KB. Base64 encoding large images will bloat the export. Use an external URL instead?\n\nCancel = encode anyway, OK = skip')) {
        return;
      }
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const ta = document.getElementById('markdown-editor');
      const alt = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      const md = '\n\n![' + alt + '](' + e.target.result + ')\n\n';
      const pos = ta.selectionStart;
      ta.value = ta.value.substring(0, pos) + md + ta.value.substring(ta.selectionEnd);
      ta.dispatchEvent(new Event('input'));
      toast('Image inserted', 'success');
    };
    reader.readAsDataURL(file);
  }

  // ── Live preview ───────────────────────────────────────────
  function updatePreview() {
    const md = document.getElementById('markdown-editor').value;
    const preview = document.getElementById('preview');
    try {
      preview.innerHTML = marked.parse(md || '*Start writing to see a live preview…*');
    } catch(e) {
      preview.innerHTML = '<p style="color:#c62828;">Error rendering markdown</p>';
    }
  }
  document.getElementById('markdown-editor').oninput = updatePreview;

  // ── Draft save/load (localStorage) ─────────────────────────
  function saveDraft() {
    const draft = {
      title: document.getElementById('title').value,
      slug: document.getElementById('slug').value,
      date: document.getElementById('date').value,
      readTime: document.getElementById('read-time').value,
      description: document.getElementById('description').value,
      heroImg: document.getElementById('hero-img').value,
      markdown: document.getElementById('markdown-editor').value,
    };
    localStorage.setItem('article_draft', JSON.stringify(draft));
    showStatus('Draft saved', true);
    toast('Draft saved', 'success');
  }

  function loadDraft() {
    const raw = localStorage.getItem('article_draft');
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      document.getElementById('title').value = d.title || '';
      document.getElementById('slug').value = d.slug || '';
      document.getElementById('date').value = d.date || '';
      document.getElementById('read-time').value = d.readTime || '';
      document.getElementById('description').value = d.description || '';
      document.getElementById('hero-img').value = d.heroImg || '';
      document.getElementById('markdown-editor').value = d.markdown || '';
      slugChanged(); descCount();
    } catch(e) {}
  }

  // Auto-save every 30s
  setInterval(() => {
    if (app.classList.contains('active')) saveDraft();
  }, 30000);

    const slug = document.getElementById('slug').value;

    const desc = document.getElementById('description').value;
    const date = document.getElementById('date').value;
    const readTime = document.getElementById('read-time').value;
    const heroImg = document.getElementById('hero-img').value || slug + '.webp';
    return { slug, title, desc, date, readTime, heroImg };
  }

    const md = document.getElementById('markdown-editor').value;
    const escapedMd = md.replace(/`/g, '\\`');

    const html = `<!DOCTYPE html>

  <meta property="og:description" content="${escHtml(desc)}">

  // ── Export listing card ────────────────────────────────────
  function exportCard() {
    const { slug, title, desc } = getMeta();
    if (!slug || !title) { toast('Title and slug required', 'error'); return; }

    const card = `    <article class="article-card">
      <h2>${escHtml(title)}</h2>
      <p class="article-synopsis">
        ${escHtml(desc || 'Add a description')}
      </p>
      <a href="/insights/${slug}" class="read-link">Read article &rarr;</a>
    </article>`;

    download(card, slug + '-listing-card.html', 'text/html');
    toast('Listing card exported ✓', 'success');
  }

  // ── Helpers ────────────────────────────────────────────────
  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function download(content, filename, mime) {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showStatus(msg, saved) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (saved ? ' saved' : '');
  }

  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type || '') + ' show';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Keyboard shortcut: Ctrl+S to save
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault(); saveDraft();
    }
  });
</script>
